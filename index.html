<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <title>Spelling Stars — Primary 2 Terms 3 &amp; 4</title>
  <style>
    :root{--ink:#24304a;--muted:#63708a;--cream:#fffaf0;--paper:#fff;--navy:#28438f;--yellow:#ffd43b;--coral:#ff6b6b;--mint:#63e6be;--line:#dfe5f0}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Trebuchet MS","Avenir Next",Avenir,Arial,sans-serif}button,input,textarea{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid rgba(50,108,255,.25);outline-offset:3px}
    #app{min-height:100vh;position:relative;overflow:hidden}#app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.26;background-image:radial-gradient(#2e4072 .65px,transparent .65px);background-size:18px 18px}.decor{position:absolute;inset:0;pointer-events:none}.decor span{position:absolute;color:#ffc928;font-size:18px;opacity:.5}.decor span:nth-child(1){left:5%;top:110px}.decor span:nth-child(2){left:17%;top:260px}.decor span:nth-child(3){left:45%;top:125px}.decor span:nth-child(4){left:71%;top:260px}.decor span:nth-child(5){left:91%;top:135px}
    .topbar{position:relative;z-index:5;max-width:1180px;margin:auto;padding:24px 30px;display:flex;align-items:center;justify-content:space-between}.brand{border:0;background:transparent;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;padding:0}.brand-mark{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--yellow);color:#403300;font-size:22px;font-weight:900;transform:rotate(-4deg);box-shadow:0 5px 0 #e6b800}.brand strong{display:block;font-size:21px;line-height:1.05}.brand small{display:block;color:var(--muted);margin-top:4px;font-weight:700}.home-btn{border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:800;padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 #d8dfeb}
    .term-tabs{position:relative;z-index:5;display:flex;gap:8px;width:min(1120px,calc(100% - 44px));margin:8px auto 0;padding:6px;background:#eef1f5;border-radius:18px}.term-tab{flex:1;min-height:48px;border:0;border-radius:13px;background:transparent;color:var(--muted);font-weight:900;cursor:pointer}.term-tab[aria-selected="true"]{background:var(--navy);color:#fff;box-shadow:0 3px 0 #192b62}
    .page{position:relative;z-index:1;width:min(1120px,calc(100% - 44px));margin:auto}.hero{min-height:570px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:40px}.eyebrow{color:var(--navy);font-size:13px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin:0 0 16px}.hero h1{font-size:clamp(60px,7vw,92px);line-height:.91;letter-spacing:-.065em;margin:0}.hero h1 em{color:var(--coral);font-style:normal;position:relative}.hero h1 em:after{content:"";position:absolute;left:5%;right:-2%;bottom:-8px;height:10px;border-radius:50%;border-top:5px solid var(--yellow);transform:rotate(-2deg)}.hero-text{color:var(--muted);font-size:19px;line-height:1.65;max-width:570px;margin:32px 0 0}.actions{display:flex;gap:13px;flex-wrap:wrap;margin-top:30px}.primary,.secondary,.text-btn{min-height:52px;border-radius:15px;padding:0 22px;border:0;font-weight:900;cursor:pointer}.primary{background:var(--navy);color:#fff;box-shadow:0 6px 0 #192b62}.secondary{background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 #d9dfeb}.text-btn{background:transparent;text-decoration:underline}
    .hero-art{height:430px;position:relative;display:grid;place-items:center}.rainbow{position:absolute;width:375px;height:240px;top:64px;border-radius:210px 210px 0 0;border:34px solid var(--coral);border-bottom:0;transform:rotate(7deg)}.rainbow i{position:absolute;border-radius:180px 180px 0 0;border-bottom:0}.rainbow i:nth-child(1){inset:0;border:31px solid var(--yellow);border-bottom:0}.rainbow i:nth-child(2){inset:31px;border:30px solid var(--mint);border-bottom:0}.rainbow i:nth-child(3){inset:61px;border:29px solid #73c0fc;border-bottom:0}.mascot{position:relative;z-index:2;width:214px;height:214px;background:#fff;border:5px solid var(--ink);border-radius:46% 54% 48% 52%;display:grid;place-items:center;transform:rotate(-5deg);box-shadow:12px 14px 0 rgba(36,48,74,.11)}.mascot-star{position:absolute;font-size:88px;color:var(--yellow);top:16px;text-shadow:3px 4px 0 #e1ad00}.face{margin-top:88px;font-size:34px;font-weight:900;letter-spacing:3px}.pencil{position:absolute;right:40px;bottom:44px;z-index:3;background:#ff8787;width:115px;height:40px;border:4px solid var(--ink);border-radius:8px;font-size:35px;line-height:32px;text-align:center;transform:rotate(-23deg)}.bubble{position:absolute;z-index:3;border:3px solid var(--ink);background:#fff;border-radius:18px;padding:13px 16px;font-weight:900;box-shadow:5px 6px 0 var(--ink)}.b1{top:45px;left:15px;transform:rotate(-8deg);color:#e64980}.b2{right:18px;top:82px;transform:rotate(8deg);color:#0ca678}
    .week-section{padding:20px 0 90px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:24px}.section-head h2,.intro h1{font-size:43px;line-height:1;margin:0;letter-spacing:-.04em}.section-head>p,.intro>p:last-child{color:var(--muted);font-weight:700}.week-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.week-card{--week:#ff6b6b;min-height:126px;padding:18px;border:2px solid var(--line);border-left:9px solid var(--week);border-radius:23px;background:rgba(255,255,255,.94);display:flex;align-items:center;gap:18px;box-shadow:0 7px 0 #e8e4d9}.week-no{width:68px;height:72px;flex:0 0 auto;background:color-mix(in srgb,var(--week) 17%,white);color:var(--week);border-radius:18px;display:grid;place-content:center;text-align:center;font-size:29px;line-height:.85;font-weight:900}.week-no span{font-size:9px;letter-spacing:.12em}.week-copy{flex:1;min-width:0}.week-copy small{color:var(--week);font-weight:900;text-transform:uppercase;letter-spacing:.08em}.week-copy h3{margin:5px 0 7px;font-size:21px}.week-copy p{margin:0;color:var(--muted);font-size:13px;font-weight:700}.round-btn{width:46px;height:46px;border:0;border-radius:50%;background:var(--week);color:#fff;font-size:23px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--week) 70%,black)}
    .intro{padding:58px 0 36px;text-align:center}.intro h1{font-size:clamp(46px,7vw,72px)}.learn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;padding-bottom:80px}.learn-card{--week:#7048e8;background:#fff;border:2px solid var(--line);border-top:9px solid var(--week);border-radius:25px;padding:24px;box-shadow:0 8px 0 #e8e4d9}.learn-top{display:flex;justify-content:space-between;align-items:center}.learn-top span{background:color-mix(in srgb,var(--week) 15%,white);color:var(--week);padding:7px 11px;border-radius:9px;font-weight:900}.learn-top small{color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.07em}.learn-card h2{margin:18px 0 12px;font-size:27px}.learn-card ol{margin:0;padding:0;list-style:none;counter-reset:words}.learn-card li{counter-increment:words;min-height:49px;display:flex;align-items:center;border-bottom:1px dashed #d7deea;font-size:18px;font-weight:800}.learn-card li:before{content:counter(words);width:27px;color:var(--week);font-weight:900}.learn-card li span{flex:1}.speak-mini{width:38px;height:38px;border:0;border-radius:50%;background:#eef2ff;cursor:pointer}.sentence-box{display:flex;gap:12px;align-items:center;margin-top:19px;background:#f4f7fb;border-radius:16px;padding:15px}.sentence-box>div{flex:1}.sentence-box small{color:var(--week);font-weight:900;text-transform:uppercase;letter-spacing:.09em}.sentence-box p{margin:5px 0 0;line-height:1.5;font-weight:700}.card-practice{width:100%;height:46px;border:0;border-radius:13px;margin-top:18px;background:var(--week);color:#fff;font-weight:900;cursor:pointer}
    .practice-page{max-width:900px;padding:35px 0 80px}.practice-head{display:flex;justify-content:space-between;align-items:end;gap:20px}.back-link{padding:0;border:0;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.practice-head .eyebrow{margin:11px 0 0;font-size:16px}.step{font-size:32px;font-weight:900}.step span{color:var(--muted);font-size:17px}.progress{height:11px;border-radius:99px;background:#e4e8ef;overflow:hidden;margin:18px 0 24px}.progress span{display:block;height:100%;border-radius:inherit}.practice-card{border:2px solid var(--line);border-radius:28px;background:rgba(255,255,255,.97);padding:clamp(20px,4vw,40px);box-shadow:0 10px 0 #e4e0d4}.prompt{text-align:center;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:12px}.listen{text-align:center;padding:22px 0 17px}.speaker{min-height:64px;padding:0 24px;border:0;border-radius:20px;background:#eef2ff;color:var(--navy);font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 5px 0 #d7def6}.listen p{color:var(--muted);font-weight:700}.paper-prompt{min-height:150px;margin:12px 0 4px;border:3px dashed #cfd7e5;border-radius:20px;background:repeating-linear-gradient(#fff 0,#fff 37px,#dce8f6 38px,#fff 39px);display:flex;align-items:center;justify-content:center;gap:16px;text-align:left;padding:24px}.paper-icon{width:64px;height:64px;flex:0 0 auto;border-radius:20px;background:var(--yellow);display:grid;place-items:center;font-size:34px;transform:rotate(-4deg);box-shadow:0 5px 0 #e6b900}.paper-prompt small,.paper-prompt strong{display:block}.paper-prompt small{color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.paper-prompt strong{font-size:25px;margin-top:4px}.result{margin-top:20px;min-height:94px;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:15px;background:#d3f9d8;color:#176b32}.result-icon{width:52px;height:52px;flex:0 0 auto;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:27px}.result>div{flex:1}.result small,.result strong{display:block}.result small{font-weight:800}.result strong{font-size:clamp(20px,3vw,27px);line-height:1.35}.practice-actions{margin-top:24px;display:flex;justify-content:space-between;gap:12px}.practice-actions button{min-height:52px;border-radius:14px;padding:0 22px;border:0;font-weight:900;cursor:pointer}.prev{background:#eef1f5}.prev:disabled{opacity:.4}.reveal{background:var(--yellow);box-shadow:0 5px 0 #e6b900}.next{background:var(--navy);color:#fff;box-shadow:0 5px 0 #192b62}
    .celebrate{min-height:560px;border:2px solid var(--line);border-radius:32px;background:#fff;display:grid;place-items:center;align-content:center;text-align:center;padding:44px;box-shadow:0 10px 0 #e4e0d4;position:relative;overflow:hidden}.celebrate:before{content:"";position:absolute;width:550px;height:550px;border-radius:50%;background:#fff8d6}.celebrate>*{position:relative}.confetti{color:var(--coral);letter-spacing:25px;margin-left:25px;font-size:23px}.big-star{color:var(--yellow);font-size:120px;line-height:1;text-shadow:5px 6px 0 #e4b600;animation:bob 1.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}.celebrate h1{margin:0;font-size:clamp(40px,7vw,64px);letter-spacing:-.05em}.celebrate>p:not(.eyebrow){color:var(--muted);font-size:18px}.celebrate .actions{justify-content:center}
    footer{position:relative;z-index:1;border-top:1px solid #e5dfd3;min-height:88px;display:flex;justify-content:center;align-items:center;gap:9px;color:var(--muted);font-weight:800}footer b{color:var(--yellow)}
    @media(max-width:800px){.topbar{padding:18px 20px}.page{width:min(100% - 26px,660px)}.hero{grid-template-columns:1fr;padding:58px 0 25px;text-align:center;min-height:auto}.hero-text{margin-left:auto;margin-right:auto}.actions{justify-content:center}.hero-art{height:370px;order:-1}.week-grid,.learn-grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column;gap:4px}}
    @media(max-width:520px){.brand small{display:none}.brand strong{font-size:18px}.brand-mark{width:43px;height:43px}.home-btn span{display:none}.hero{padding-top:18px;gap:16px}.hero-art{height:280px;transform:scale(.82);margin:-30px}.hero h1{font-size:57px}.hero-text{font-size:16px}.hero .actions{display:grid}.hero .primary,.hero .secondary{width:100%}.week-section{padding-top:65px}.section-head h2{font-size:35px}.week-card{padding:14px;gap:12px}.week-no{width:58px;height:65px}.week-copy h3{font-size:18px}.round-btn{width:40px;height:40px}.learn-card{padding:19px}.learn-top small{display:none}.practice-card{padding:18px 12px}.paper-prompt{min-height:125px;padding:18px}.paper-icon{width:52px;height:52px;font-size:28px}.paper-prompt strong{font-size:21px}.practice-actions{display:grid;grid-template-columns:1fr 1fr}.practice-actions button{padding:0 10px}.result .speak-mini{display:none}.celebrate{min-height:500px;padding:30px 17px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const TERMS={3:[
      {week:2,title:"Sight Words",label:"Warm-up words",colour:"#ff6b6b",words:["would","quickly","smiled","nodded","decided"],sentence:"Mother thanked our neighbour for helping her."},
      {week:3,title:"Magnetic Max",label:"Unit 9",colour:"#f59f00",words:["bunch","magnet","pockets","paper clips","skateboard"],sentence:"Odd things happen when people walk under this tree."},
      {week:4,title:"Sight Words",label:"Brilliant basics",colour:"#12b886",words:["under","right","being","healthy","exercise"],sentence:"David stormed into his room after arguing with his brother."},
      {week:5,title:"A Snake in the Garden",label:"Unit 10",colour:"#20a0d8",words:["giant","monster","marched","vegetable","dangerous"],sentence:"There is nothing in the garden but tomatoes and a green hose."},
      {week:6,title:"Sight Words",label:"Super sight words",colour:"#845ef7",words:["half","almost","spend","loudly","listened"],sentence:"That night, I fell asleep very quickly."},
      {week:8,title:"The Feast",label:"Unit 11",colour:"#e64980",words:["furious","served","danced","fabulous","invitation"],sentence:"He went home with tears in his dinosaur eyes."},
      {week:9,title:"Sight Words",label:"Final word quest",colour:"#7048e8",words:["learn","places","angry","holidays","delicious"],sentence:"James bowed his head and apologised to Mary for pushing her."}
    ],4:[
      {week:2,title:"Willy and Hugh",label:"Unit 12",colour:"#ff6b6b",words:["lonely","amazed","business","appeared","terrifying"],sentence:"Everyone seemed to have friends except Willy."},
      {week:4,title:"Sight Words",label:"Sight words",colour:"#f59f00",words:["finally","helpful","happily","excited","herself"],sentence:"We rushed over to see what had happened."},
      {week:6,title:"Postcards to David",label:"Unit 13",colour:"#12b886",words:["night","awake","another","learning","afternoon"],sentence:"On a hazy October evening, David got another postcard."},
      {week:7,title:"Sight Words",label:"Sight words",colour:"#20a0d8",words:["dinner","usually","surprised","wonderful","sometimes"],sentence:"My heart began to beat faster."},
      {week:8,title:"The Bicycle Race",label:"Unit 14",colour:"#845ef7",words:["useful","pedalled","colourful","cheered","disappointed"],sentence:"The children were ready for the race."}
    ]};
    const getWeeks=()=>TERMS[state.term];
    const state={term:4,screen:"home",weekIndex:0,part:"words",itemIndex:0,revealed:false,celebrate:false};
    const app=document.getElementById("app");
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function speak(text){if(!("speechSynthesis" in window)){alert("Speech is not available in this browser.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-SG";u.rate=.72;u.pitch=1.05;speechSynthesis.speak(u)}
    function shell(content){return `<div class="decor" aria-hidden="true"><span>✦</span><span>★</span><span>✦</span><span>★</span><span>✦</span></div><header class="topbar"><button class="brand" data-action="home" aria-label="Go to home"><span class="brand-mark">Aa</span><span><strong>Spelling Stars</strong><small>Primary 2 · Term ${state.term}</small></span></button>${state.screen!=="home"?'<button class="home-btn" data-action="home">⌂ <span>Home</span></button>':""}</header><nav class="term-tabs" role="tablist" aria-label="Spelling term">${[3,4].map(term=>`<button class="term-tab" id="term-tab-${term}" role="tab" aria-selected="${state.term===term}" aria-controls="term-panel" tabindex="${state.term===term?0:-1}" data-action="term" data-term="${term}">Term ${term}</button>`).join("")}</nav><div id="term-panel" role="tabpanel" aria-labelledby="term-tab-${state.term}">${content}</div><footer><span>Made for little learners with big dreams</span><b>★</b></footer>`}
    function home(){const cards=getWeeks().map((w,i)=>`<article class="week-card" style="--week:${w.colour}"><div class="week-no"><span>WEEK</span>${w.week}</div><div class="week-copy"><small>${w.label}</small><h3>${w.title}</h3><p>5 words · 1 sentence</p></div><button class="round-btn" data-action="start" data-week="${i}" aria-label="Practise week ${w.week}">→</button></article>`).join("");return shell(`<div class="page"><section class="hero"><div><p class="eyebrow">Yew Tee Primary School · Spelling List 2026</p><h1>Listen. Write.<br><em>Shine!</em></h1><p class="hero-text">${state.term===3?"Seven":"Five"} weeks of Term ${state.term} spelling adventures are waiting. Listen carefully, write each answer on paper, then check it on screen!</p><div class="actions"><button class="primary" data-action="start" data-week="0">▶ Start practising</button><button class="secondary" data-action="learn">☰ View spelling list</button></div></div><div class="hero-art" aria-hidden="true"><div class="rainbow"><i></i><i></i><i></i></div><div class="mascot"><span class="mascot-star">★</span><span class="face">•ᴗ•</span></div><div class="pencil">✎</div><div class="bubble b1">ABC</div><div class="bubble b2">+1</div></div></section><section class="week-section"><div class="section-head"><div><p class="eyebrow">Choose your adventure</p><h2>Term ${state.term}: Pick a week</h2></div><p>Each week has 5 words and 1 sentence.</p></div><div class="week-grid">${cards}</div></section></div>`)}
    function miniSpeak(text){return `<button class="speak-mini" data-action="speak" data-text="${encodeURIComponent(text)}" aria-label="Read aloud: ${esc(text)}">🔊</button>`}
    function learn(){const cards=getWeeks().map((w,i)=>`<article class="learn-card" style="--week:${w.colour}"><div class="learn-top"><span>Week ${w.week}</span><small>${w.label}</small></div><h2>${w.title}</h2><ol>${w.words.map(x=>`<li><span>${esc(x)}</span>${miniSpeak(x)}</li>`).join("")}</ol><div class="sentence-box"><div><small>Sentence</small><p>${esc(w.sentence)}</p></div>${miniSpeak(w.sentence)}</div><button class="card-practice" data-action="start" data-week="${i}">Practise week ${w.week} →</button></article>`).join("");return shell(`<div class="page"><section class="intro"><p class="eyebrow">Learn at your own pace</p><h1>Term ${state.term} spelling list</h1><p>Tap any speaker to hear a word or sentence.</p></section><div class="learn-grid">${cards}</div></div>`)}
    function practice(){const w=getWeeks()[state.weekIndex],target=state.part==="words"?w.words[state.itemIndex]:w.sentence,total=6,index=state.part==="words"?state.itemIndex:5;if(state.celebrate)return shell(`<div class="page practice-page"><section class="celebrate"><div class="confetti">✦ ★ ✦ ★ ✦</div><div class="big-star">★</div><p class="eyebrow">Week ${w.week} complete</p><h1>You’re a spelling star!</h1><p>You listened to all 5 words and the sentence. Great effort!</p><div class="actions"><button class="primary" data-action="restart">Practise again</button>${state.weekIndex<getWeeks().length-1?'<button class="secondary" data-action="nextweek">Next week →</button>':""}<button class="text-btn" data-action="home">Choose another week</button></div></section></div>`);
      const result=state.revealed?`<div class="result" role="status"><span class="result-icon">✓</span><div><small>Check your paper. The answer is</small><strong>${esc(target)}</strong></div>${miniSpeak(target)}</div>`:"";
      return shell(`<div class="page practice-page"><section class="practice-head"><div><button class="back-link" data-action="home">← All weeks</button><p class="eyebrow">Week ${w.week} · ${w.title}</p></div><div class="step">${index+1} <span>/ ${total}</span></div></section><div class="progress"><span style="width:${(index+1)/total*100}%;background:${w.colour}"></span></div><section class="practice-card"><div class="prompt">${state.part==="words"?`Word ${state.itemIndex+1} of 5`:"Sentence time"}</div><div class="listen"><button class="speaker" data-action="speak" data-text="${encodeURIComponent(target)}">🔊 &nbsp; Listen again</button><p>${state.part==="words"?"Listen carefully to the word.":"Listen carefully to the whole sentence."}</p></div><div class="paper-prompt"><span class="paper-icon">✎</span><div><small>Now it’s your turn</small><strong>Write it down on paper</strong></div></div>${result}<div class="practice-actions"><button class="prev" data-action="previous" ${state.part==="words"&&state.itemIndex===0?"disabled":""}>← Previous</button>${!state.revealed?'<button class="reveal" data-action="reveal">Reveal answer</button>':`<button class="next" data-action="next">${state.part==="sentence"?"Finish week":"Next"} →</button>`}</div></section></div>`)}
    function render(){app.innerHTML=state.screen==="home"?home():state.screen==="learn"?learn():practice()}
    function selectTerm(term){if(term===state.term)return;if("speechSynthesis" in window)speechSynthesis.cancel();Object.assign(state,{term,screen:state.screen==="learn"?"learn":"home",weekIndex:0,part:"words",itemIndex:0,revealed:false,celebrate:false});render();document.getElementById(`term-tab-${term}`).focus()}
    app.addEventListener("keydown",e=>{if(!e.target.matches('[role="tab"]'))return;const keys=["ArrowLeft","ArrowRight","Home","End"];if(!keys.includes(e.key))return;e.preventDefault();selectTerm(e.key==="Home"?3:e.key==="End"?4:state.term===3?4:3)});
    function start(i){Object.assign(state,{screen:"practice",weekIndex:i,part:"words",itemIndex:0,revealed:false,celebrate:false});render();speak(getWeeks()[i].words[0]);window.scrollTo(0,0)}
    function next(){const w=getWeeks()[state.weekIndex];if(state.part==="words"&&state.itemIndex<4){state.itemIndex++;state.revealed=false;render();speak(w.words[state.itemIndex])}else if(state.part==="words"){state.part="sentence";state.revealed=false;render();speak(w.sentence)}else{state.celebrate=true;render();window.scrollTo(0,0)}}
    app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.action;if(a==="term")selectTerm(Number(b.dataset.term));else if(a==="home"){if("speechSynthesis" in window)speechSynthesis.cancel();state.screen="home";render();window.scrollTo(0,0)}else if(a==="learn"){state.screen="learn";render();window.scrollTo(0,0)}else if(a==="start")start(Number(b.dataset.week));else if(a==="speak")speak(decodeURIComponent(b.dataset.text));else if(a==="reveal"){state.revealed=true;render()}else if(a==="next")next();else if(a==="previous"){const w=getWeeks()[state.weekIndex];if(state.part==="sentence"){state.part="words";state.itemIndex=4}else if(state.itemIndex>0)state.itemIndex--;state.revealed=false;render();speak(w.words[state.itemIndex])}else if(a==="restart")start(state.weekIndex);else if(a==="nextweek")start(state.weekIndex+1)});
    render();
  </script>
</body>
</html>
